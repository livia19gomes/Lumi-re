<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lumiére - Cadastro de Disponibilidade</title>
  <link rel="stylesheet" href="assets/css/index.cadastroservico.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Playfair+Display:ital,wght@1,700&display=swap" rel="stylesheet">
  <script src="assets/js/seguranca.js" defer></script>
</head>
<body>
  <header>
    <img src="assets/img/logo.png" alt="LUMIÉRE - Beleza | Estética | Bem-estar" class="logo">
    <nav>
      <a class="logoutcabecalho btn-logout" style="cursor: pointer;">LOGOUT</a>
      <a href="edicao_dados.html">EDIÇÃO DE DADOS</a>
      <a href="cadastroservico.html">CADASTRAR SERVIÇOS</a>
      <a href="index.cadastroservico.html">CADASTRAR AGENDAMENTO</a>
      <a href="horarios_disponiveisPROF.html">LISTA HORARIOS</a>
      <a href="painel_profissional.html">PAINEL PROFISSIONAL</a>
      <a href="painel_administrativo.html">PAINEL ADMINISTRATIVO</a>
      <a href="listagem.html">LISTAGEM</a>
    </nav>
  </header>

  <section class="cadastro-container">
    <div class="decorative-line">
      <h1><span style="color:#fff;">Disponibilidade</span></h1>
      <p class="subtitulo">Cadastre seu horário de trabalho</p>
    </div>

    <!-- Formulário de Disponibilidade -->
    <form class="form-cadastro">
      <div class="form-group">
        <label for="dia_semana">DIA DA SEMANA</label>
        <select id="dia_semana" class="selecionar" required>
          <option value="">Selecione...</option>
          <option value="1">Segunda</option>
          <option value="2">Terça</option>
          <option value="3">Quarta</option>
          <option value="4">Quinta</option>
          <option value="5">Sexta</option>
          <option value="6">Sábado</option>
          <option value="7">Domingo</option>
        </select>
      </div>
      <div class="form-group">
        <label for="hora_inicio">HORA INÍCIO</label>
        <input type="time" id="hora_inicio" class="selecionarD" required>
      </div>
      <div class="form-group">
        <label for="hora_fim">HORA FIM</label>
        <input type="time" id="hora_fim" class="selecionarD" required>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn-enviar">ENVIAR</button>
      </div>
    </form>
  </section>

  <footer class="footer">
    <div class="footer1">
      <div class="footer-left">
        <div class="contact">
          <img src="assets/img/celular.icon.png" alt="Telefone" class="icon">
          <span>(18)000000000</span>
        </div>
        <div class="contact">
          <img src="assets/img/location-icon.png" alt="Localização" class="icon">
          <span>Avenida das flores</span>
        </div>
      </div>
      <div class="footer-center">
        <img src="assets/img/logo.png" alt="Logo Lumiére" class="logo">
      </div>
    </div>
    <div class="footer-bottom">
      <span>© 2025. Todos os direitos reservados.</span>
    </div>
  </footer>

  <script>
    // Cadastro de disponibilidade - ENVIE ESTE SCRIPT COMPLETO AO FINAL DO SEU HTML
    document.querySelector(".form-cadastro").addEventListener("submit", async (e) => {
      e.preventDefault();

    const dia_semana = document.getElementById("dia_semana").value;
    const hora_inicio = document.getElementById("hora_inicio").value;
    const hora_fim = document.getElementById("hora_fim").value;
    const id_cadastro = localStorage.getItem("id_cadastro");

    if (!dia_semana || !hora_inicio || !hora_fim || !id_cadastro) {
      Swal.fire({
        icon: "error",
        title: "Erro",
        text: "Todos os campos são obrigatórios!"
      });
      return;
    }

    // FORMATO QUE O BACKEND ESPERA:
    const dados = {
      id_cadastro,
      dias: [{
        dia_semana,
        hora_inicio,
        hora_fim
      }]
    };

    try {
      const response = await fetch("http://10.92.3.168:5000/disponibilidade/profissional", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(dados)
      });
      // resto igual...


        if (response.ok) {
          const result = await response.json();
          Swal.fire({
            icon: "success",
            title: "Sucesso!",
            text: result.message
          }).then(() => {
            window.location.href = "painel_profissional.html";
          });
        } else {
          const error = await response.json();
          Swal.fire({
            icon: "error",
            title: "Oops...",
            text: error.error || "Erro ao cadastrar disponibilidade!"
          });
        }
      } catch (err) {
        Swal.fire({
          icon: "error",
          title: "Falha na conexão",
          text: "Não foi possível conectar ao servidor."
        });
      }
    });

    // Script de logout permanece igual ao seu
    document.addEventListener('DOMContentLoaded', function () {
      const logoutBtn = document.querySelector('.btn-logout');
      if (!logoutBtn) return;
      logoutBtn.addEventListener('click', function (e) {
        e.preventDefault();
        Swal.fire({
          title: 'Deseja realmente sair?',
          text: 'Você precisará fazer login novamente.',
          icon: 'warning',
          showCancelButton: true,
          confirmButtonText: 'SIM',
          cancelButtonText: 'NÃO',
          reverseButtons: true
        }).then((result) => {
          if (result.isConfirmed) {
            try {
              localStorage.removeItem('token');
              sessionStorage.removeItem('token');
              document.cookie = 'session=; Max-Age=0; path=/;';
              Swal.fire({
                icon: 'success',
                title: 'Desconectado',
                showConfirmButton: false,
                timer: 1200
              }).then(() => {
                window.location.href = 'login.html';
              });
            } catch (err) {
              Swal.fire('Erro', 'Não foi possível deslogar. Tente novamente.', 'error');
            }
          }
        });
      });
    });
  </script>
</body>
</html>
